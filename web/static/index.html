<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>AIDM</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/style.css?v=15">
</head>
<body>
  <div class="topbar">
    <div class="top-actions">
      <button type="button" id="menu-toggle" aria-expanded="false" aria-controls="topbar-body" data-i18n="btn.menu">Меню</button>
      <div class="models">
        <button type="button" id="models-toggle" aria-haspopup="menu" aria-expanded="false" aria-controls="models-menu">
          <span data-i18n="btn.models">Модели</span>
          <span id="models-current" hidden></span>
        </button>
        <div id="models-menu" class="pop" role="menu" hidden></div>
      </div>
      <div class="modes">
        <button type="button" id="modes-toggle" aria-haspopup="menu" aria-expanded="false">
          <span data-i18n="btn.modes">Режимы</span>
          <span id="modes-current">Песочница</span>
        </button>
        <div id="modes-menu" class="pop" role="menu" hidden></div>
      </div>
    </div>
    <div id="topbar-body">
    <header>
      <h1 data-i18n="app_title">AIDM</h1>
      <div class="worlds-picker">
        <button type="button" id="world-toggle" aria-haspopup="menu" aria-expanded="false" aria-controls="world-menu">
          <span id="world-current" data-i18n="no_worlds">Нет миров</span>
        </button>
        <div id="world-menu" class="pop" role="menu" hidden></div>
      </div>
      <button type="button" id="lang">RU</button>
    </header>

    <nav>
      <button type="button" data-panel="worlds" data-i18n="btn.worlds">Миры</button>
      <button type="button" data-panel="files" data-i18n="btn.world_files">Файлы</button>
      <button type="button" data-panel="cards" data-i18n="btn.cards">Карточки</button>
      <button type="button" data-panel="memory" data-i18n="btn.memory">Память</button>
      <button type="button" data-panel="settings" data-i18n="btn.ai_settings">Настройки</button>
      <button type="button" data-panel="prompt" data-i18n="btn.prompt">Промпт</button>
      <button type="button" data-panel="scene" data-i18n="btn.scene_prompt">Сцена</button>
      <button type="button" id="toggle-summary"></button>
      <span id="summary-count"></span>
      <button type="button" id="toggle-memory"></button>
      <span id="memory-count"></span>
    </nav>
    </div>
  </div>

  <main>
    <article id="log"></article>
    <p id="notice" class="system" role="status" aria-live="polite" hidden></p>
    <div id="bar-row">
      <div id="bar" class="ok"><span></span></div>
      <div id="bar-meta">
        <p id="bar-label"></p>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </div>
    <form id="composer">
      <textarea id="action" rows="3" aria-label="Сделать ход"></textarea>
      <div class="composer-actions">
        <button type="button" id="act" data-i18n="btn.make_move">Сделать ход</button>
        <button type="submit" id="send" data-i18n="btn.send">Отправить</button>
        <button type="button" id="next" data-i18n="btn.next">Дальше?</button>
        <button type="button" id="undo" data-i18n="btn.undo">Отмена</button>
        <button type="button" id="reroll" data-i18n="btn.reroll">Ещё раз</button>
        <button type="button" id="edit" data-i18n="btn.edit_last">Редактировать</button>
        <button type="button" id="summarize" data-i18n="btn.summary">Саммари</button>
      </div>
    </form>
  </main>

  <dialog id="next-dialog">
    <header>
      <strong data-i18n="dialog.next_title">Дальше?</strong>
      <button type="button" id="next-close" data-i18n="btn.close">Закрыть</button>
    </header>
    <form id="next-form">
      <p id="next-hint" class="hint" data-i18n="dialog.next_hint"></p>
      <p id="next-error" class="error"></p>
      <textarea id="next-text" rows="6"></textarea>
      <div class="row">
        <button type="submit" class="primary" data-i18n="btn.send">Отправить</button>
        <button type="button" id="next-cancel" data-i18n="btn.cancel_plain">Отмена</button>
      </div>
    </form>
  </dialog>

  <dialog id="hero-dialog">
    <header>
      <strong data-i18n="hero.title">Карточка героя</strong>
      <button type="button" id="hero-close" data-i18n="btn.close">Закрыть</button>
    </header>
    <form id="hero-form">
      <p class="hint" data-i18n="hero.required">Заполните карточку героя, чтобы начать ход.</p>
      <p id="hero-error" class="error"></p>
      <label><span data-i18n="hero.name">Имя</span><input id="hero-name" type="text" required></label>
      <label><span data-i18n="hero.appearance">Внешность</span><textarea id="hero-appearance" rows="3"></textarea></label>
      <label><span data-i18n="hero.equipment">Снаряжение</span><textarea id="hero-equipment" rows="3"></textarea></label>
      <div class="hero-stats">
        <label><span data-i18n="hero.strength">Сила</span><input id="hero-strength" type="number" min="1" max="30" value="10"></label>
        <label><span data-i18n="hero.dexterity">Ловкость</span><input id="hero-dexterity" type="number" min="1" max="30" value="10"></label>
        <label><span data-i18n="hero.constitution">Телосложение</span><input id="hero-constitution" type="number" min="1" max="30" value="10"></label>
        <label><span data-i18n="hero.intelligence">Интеллект</span><input id="hero-intelligence" type="number" min="1" max="30" value="10"></label>
        <label><span data-i18n="hero.wisdom">Мудрость</span><input id="hero-wisdom" type="number" min="1" max="30" value="10"></label>
        <label><span data-i18n="hero.charisma">Харизма</span><input id="hero-charisma" type="number" min="1" max="30" value="10"></label>
      </div>
      <div class="row">
        <button type="submit" class="primary" data-i18n="btn.save">Сохранить</button>
      </div>
    </form>
  </dialog>

  <dialog id="stat-dialog">
    <header>
      <strong data-i18n="hero.confirm_title">Изменить характеристики?</strong>
      <button type="button" id="stat-close" data-i18n="btn.close">Закрыть</button>
    </header>
    <p class="hint" data-i18n="hero.confirm_hint">Сцена предлагает изменить характеристики. Снаряжение и внешность уже записаны.</p>
    <div id="stat-list"></div>
    <div class="row">
      <button type="button" id="stat-accept" class="primary" data-i18n="hero.confirm">Применить</button>
      <button type="button" id="stat-reject" data-i18n="hero.reject">Оставить как есть</button>
    </div>
  </dialog>

  <dialog id="panel">
    <header>
      <strong id="panel-title"></strong>
      <button type="button" id="panel-close" data-i18n="btn.close">Закрыть</button>
    </header>
    <div id="panel-body"></div>
  </dialog>

  <script src="/static/app.js?v=15"></script>
</body>
</html>
